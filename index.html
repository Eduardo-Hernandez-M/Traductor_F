<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Profesional</title>
    <style>
        :root {
            --primary-blue: #004080;
            --secondary-blue: #0059b3;
            --black: #1a1a1a;
            --white: #ffffff;
            --bg-gray: #f4f6f9;
            --border: #dce1e6;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 20px; display: flex; justify-content: center; color: var(--black); }
        .container { background: var(--white); padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 500px; border-top: 5px solid var(--primary-blue); }
        h2 { text-align: center; color: var(--black); margin-top: 0; }
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 25px; }
        label { font-weight: 600; margin-top: 15px; display: block; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 8px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-family: inherit; transition: border 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary-blue); }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; font-size: 1em; }
        .btn-primary { background-color: var(--primary-blue); color: var(--white); }
        .btn-primary:hover { background-color: var(--secondary-blue); }
        .btn-outline { background-color: transparent; color: var(--primary-blue); border: 1px solid var(--primary-blue); }
        .btn-outline:hover { background-color: #f0f4f8; }
        .btn-black { background-color: var(--black); color: var(--white); }
        .btn-black:hover { background-color: #333; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .user-tag { font-size: 0.9em; font-weight: bold; color: var(--primary-blue); }
        
        .status { text-align: center; font-size: 0.85em; color: #666; height: 20px; margin-top: -5px; margin-bottom: 10px; }
        #app-view, #auth-view { transition: opacity 0.3s; }
        .hidden { display: none !important; }
        
        /* Estilos del panel de administrador */
        .admin-panel { margin-top: 25px; padding: 20px; border: 1px solid var(--border); border-radius: 6px; background-color: #f8fafd; }
        .admin-panel h4 { margin-top: 0; color: var(--primary-blue); margin-bottom: 10px;}
    </style>
</head>
<body>

<!-- PANTALLA DE AUTENTICACIÓN -->
<div class="container" id="auth-view">
    <h2>Traductor Seguro</h2>
    <div class="subtitle">Ingresa tus credenciales para acceder</div>
    
    <label>Usuario</label>
    <input type="text" id="username" placeholder="Tu nombre de usuario">
    
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
    
    <div class="status" id="authStatus"></div>

    <button class="btn btn-primary" onclick="login()">Iniciar Sesión</button>
</div>

<!-- PANTALLA DEL TRADUCTOR -->
<div class="container hidden" id="app-view">
    <div class="header-bar">
        <span class="user-tag" id="userDisplay">Usuario</span>
        <button class="btn btn-outline" style="width: auto; padding: 5px 15px; margin: 0;" onclick="logout()">Salir</button>
    </div>

    <label>Dirección de Traducción</label>
    <select id="direction">
        <option value="es-zh">🇪🇸 Español  ➔  🇨🇳 Chino Mandarín</option>
        <option value="zh-es">🇨🇳 Chino  ➔  🇪🇸 Español</option>
    </select>

    <label>Texto de entrada</label>
    <textarea id="inputText" placeholder="Escribe aquí o usa el micrófono..."></textarea>
    <div class="status" id="micStatus"></div>

    <div class="btn-group">
        <button class="btn btn-black" onclick="startDictation()">🎤 Dictar</button>
        <button class="btn btn-primary" onclick="translateText()">Traducir</button>
    </div>

    <label>Traducción</label>
    <textarea id="outputText" readonly placeholder="El resultado aparecerá aquí..."></textarea>
    
    <button class="btn btn-outline" onclick="speakTranslation()">🔊 Reproducir Audio</button>

    <!-- PANEL EXCLUSIVO PARA ADMINISTRADOR -->
    <div id="adminPanel" class="admin-panel hidden">
        <h4>Panel de Administrador: Nuevo Usuario</h4>
        <input type="text" id="newUsername" placeholder="Nombre del nuevo usuario">
        <input type="password" id="newPassword" placeholder="Contraseña asignada">
        <button class="btn btn-black" onclick="createUser()">Registrar Usuario</button>
        <div class="status" id="regStatus" style="margin-top: 10px;"></div>
    </div>
</div>

<script>
    const API_BASE = window.location.origin;

    // --- LÓGICA DE AUTENTICACIÓN ---
    async function login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const status = document.getElementById('authStatus');

        if (!user || !pass) {
            status.innerText = "Completa todos los campos.";
            status.style.color = "red";
            return;
        }

        status.innerText = "Iniciando sesión...";
        status.style.color = "#666";

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();

            if (res.ok) {
                sessionStorage.setItem('token', data.access_token);
                sessionStorage.setItem('username', data.username);
                showApp();
            } else {
                status.innerText = data.detail || "Error al iniciar sesión";
                status.style.color = "red";
            }
        } catch (err) {
            status.innerText = "Error de conexión.";
            status.style.color = "red";
        }
    }

    // --- LÓGICA DE CREACIÓN DE USUARIO (SOLO ADMIN) ---
    async function createUser() {
        const user = document.getElementById('newUsername').value.trim();
        const pass = document.getElementById('newPassword').value.trim();
        const status = document.getElementById('regStatus');
        const token = sessionStorage.getItem('token');

        if (!user || !pass) {
            status.innerText = "Completa los campos del nuevo usuario.";
            status.style.color = "red";
            return;
        }

        status.innerText = "Creando...";
        status.style.color = "#666";

        try {
            const res = await fetch(`${API_BASE}/register`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();

            if (res.ok) {
                status.innerText = data.message;
                status.style.color = "green";
                document.getElementById('newUsername').value = "";
                document.getElementById('newPassword').value = "";
            } else {
                status.innerText = data.detail || "Error al crear el usuario";
                status.style.color = "red";
            }
        } catch (err) {
            status.innerText = "Error de conexión.";
            status.style.color = "red";
        }
    }
    
    function logout() {
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('username');
        document.getElementById('password').value = "";
        document.getElementById('authStatus').innerText = "";
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('auth-view').classList.remove('hidden');
    }

    function showApp() {
        const token = sessionStorage.getItem('token');
        const username = sessionStorage.getItem('username');
        
        if (token) {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = `👤 ${username}`;
            
            // Mostrar panel de administrador solo si el usuario es admin
            if (username.toLowerCase() === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('adminPanel').classList.add('hidden');
            }
        }
    }

    // --- LÓGICA DE MICRÓFONO ---
    function startDictation() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Tu navegador no soporta dictado por voz. Usa Chrome, Edge o Safari.");
            return;
        }
        
        const recognition = new SpeechRecognition();
        const dir = document.getElementById('direction').value;
        recognition.lang = dir === 'es-zh' ? 'es-MX' : 'zh-CN';
        recognition.continuous = false;
        recognition.interimResults = false;

        const status = document.getElementById('micStatus');
        status.innerText = "Escuchando... (Habla ahora)";
        status.style.color = "red";

        recognition.start();

        recognition.onresult = function(e) {
            document.getElementById('inputText').value = e.results[0][0].transcript;
            status.innerText = "Audio capturado.";
            status.style.color = "green";
            setTimeout(() => status.innerText = "", 3000);
        };

        recognition.onerror = function(e) {
            status.innerText = "Error al escuchar: " + e.error;
            status.style.color = "red";
        }
    }

    // --- LÓGICA DE TRADUCCIÓN ---
    async function translateText() {
        const text = document.getElementById('inputText').value.trim();
        const direction = document.getElementById('direction').value;
        const outBox = document.getElementById('outputText');
        const token = sessionStorage.getItem('token');

        if (!text) return alert("Escribe un texto primero.");
        outBox.value = "Traduciendo...";

        try {
            const res = await fetch(`${API_BASE}/translate`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ text, direction })
            });
            const data = await res.json();

            if (res.ok) {
                outBox.value = data.translation;
            } else if (res.status === 401) {
                alert("Tu sesión ha expirado. Por favor, inicia sesión de nuevo.");
                logout();
            } else {
                outBox.value = `Error: ${data.detail}`;
            }
        } catch (err) {
            outBox.value = "Error de red al intentar traducir.";
        }
    }

    // --- LÓGICA DE ALTAVOZ ---
    function speakTranslation() {
        const textToSpeak = document.getElementById('outputText').value;
        if (!textToSpeak || textToSpeak.startsWith("Error") || textToSpeak === "Traduciendo...") return;

        const synth = window.speechSynthesis;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        const dir = document.getElementById('direction').value;
        
        utterance.lang = dir === 'es-zh' ? 'zh-CN' : 'es-MX'; 
        synth.speak(utterance);
    }

    window.onload = showApp;
</script>

</body>
</html>
